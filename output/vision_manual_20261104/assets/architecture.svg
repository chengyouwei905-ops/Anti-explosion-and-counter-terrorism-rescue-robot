<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 370" role="img"><title>视觉数据处理的六层链路</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#467b94"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#203d4e}.t{font-size:19px;font-weight:bold}.s{font-size:15px;fill:#476778}.a{fill:none;stroke:#467b94;stroke-width:2;marker-end:url(#arrow)}</style><rect width="1120" height="370" rx="15" fill="#f8fbfd"/><text class="s" x="28" y="30">MCU 请求 → TaskManager 选择任务与控制时限；主线程按下面的数据链执行</text><rect x="28" y="65" width="320" height="86" rx="12" fill="#eef5fa" stroke="#bdced8"/><text class="t" x="188.0" y="96" text-anchor="middle">相机原图</text><text class="s" x="188.0" y="123" text-anchor="middle">RGB888 / QR 灰度</text><rect x="400" y="65" width="320" height="86" rx="12" fill="#eef5fa" stroke="#bdced8"/><text class="t" x="560.0" y="96" text-anchor="middle">目标检测</text><text class="s" x="560.0" y="123" text-anchor="middle">YOLO / LAB / find_qrcodes</text><rect x="772" y="65" width="320" height="86" rx="12" fill="#eef5fa" stroke="#bdced8"/><text class="t" x="932.0" y="96" text-anchor="middle">单帧几何</text><text class="s" x="932.0" y="123" text-anchor="middle">角点或轮廓 → C 系坐标</text><rect x="28" y="235" width="320" height="86" rx="12" fill="#eef5fa" stroke="#bdced8"/><text class="t" x="188.0" y="266" text-anchor="middle">手眼变换</text><text class="s" x="188.0" y="293" text-anchor="middle">C 系 → TCP E 系</text><rect x="400" y="235" width="320" height="86" rx="12" fill="#eef5fa" stroke="#bdced8"/><text class="t" x="560.0" y="266" text-anchor="middle">有效采样</text><text class="s" x="560.0" y="293" text-anchor="middle">身份、散布、三帧 / 窗口</text><rect x="772" y="235" width="320" height="86" rx="12" fill="#eef5fa" stroke="#bdced8"/><text class="t" x="932.0" y="266" text-anchor="middle">统一回包</text><text class="s" x="932.0" y="293" text-anchor="middle">protocol → vision_link → MCU</text><path class="a" d="M348 108H390"/><path class="a" d="M720 108H762"/><path class="a" d="M932 151V195H188V225"/><path class="a" d="M348 278H390"/><path class="a" d="M720 278H762"/><text class="s" x="450" y="190">得到物理位置后，再判断能否控制和累计</text></svg>