<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" role="img"><title>二维码滚动窗口的有效帧与过期</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#467b94"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#203d4e}.t{font-size:19px;font-weight:bold}.s{font-size:15px;fill:#476778}.a{fill:none;stroke:#467b94;stroke-width:2;marker-end:url(#arrow)}</style><rect width="1120" height="330" rx="15" fill="#f8fbfd"/><text class="t" x="30" y="38">有效样本可以跨过短暂漏检，仍需满足同码和位置稳定</text><path d="M70 115H1045" stroke="#adc1cc" stroke-width="3"/><circle cx="90" cy="115" r="10" fill="#14836f"/><text class="t" x="90" y="87" text-anchor="middle">有效 1</text><text class="s" x="90" y="155" text-anchor="middle">0.0s</text><circle cx="300" cy="115" r="10" fill="#8a9aa4"/><text class="t" x="300" y="87" text-anchor="middle">漏检</text><text class="s" x="300" y="155" text-anchor="middle">0.5s</text><circle cx="510" cy="115" r="10" fill="#14836f"/><text class="t" x="510" y="87" text-anchor="middle">有效 2</text><text class="s" x="510" y="155" text-anchor="middle">1.0s</text><circle cx="720" cy="115" r="10" fill="#8a9aa4"/><text class="t" x="720" y="87" text-anchor="middle">漏检</text><text class="s" x="720" y="155" text-anchor="middle">1.4s</text><circle cx="930" cy="115" r="10" fill="#14836f"/><text class="t" x="930" y="87" text-anchor="middle">有效 3</text><text class="s" x="930" y="155" text-anchor="middle">2.0s</text><rect x="35" y="189" width="1050" height="108" rx="10" fill="#fff4dd"/><text class="t" x="55" y="224">计算慢也会使样本过期</text><text class="s" x="55" y="255">例如结果分别在 0.0s、1.8s、3.6s 才可用，第一张可能在第三张完成前已离开三秒窗口。</text><text class="s" x="55" y="280">窗口时间按软件取图返回时间计算；实际单帧处理耗时需要测量。</text></svg>