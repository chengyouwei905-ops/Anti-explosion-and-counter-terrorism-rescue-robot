<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 270" role="img"><title>正式任务状态机与结果返回</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#467b94"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#203d4e}.t{font-size:19px;font-weight:bold}.s{font-size:15px;fill:#476778}.a{fill:none;stroke:#467b94;stroke-width:2;marker-end:url(#arrow)}</style><rect width="1120" height="270" rx="15" fill="#f8fbfd"/><rect x="26" y="50" width="250" height="88" rx="12" fill="#eef5fa" stroke="#bdced8"/><text class="t" x="151.0" y="81" text-anchor="middle">IDLE</text><text class="s" x="151.0" y="108" text-anchor="middle">等 MCU 请求</text><path class="a" d="M276 94H292"/><rect x="300" y="50" width="250" height="88" rx="12" fill="#eef5fa" stroke="#bdced8"/><text class="t" x="425.0" y="81" text-anchor="middle">SETTLING</text><text class="s" x="425.0" y="108" text-anchor="middle">定位额外等 250ms</text><path class="a" d="M550 94H566"/><rect x="574" y="50" width="250" height="88" rx="12" fill="#eef5fa" stroke="#bdced8"/><text class="t" x="699.0" y="81" text-anchor="middle">RUNNING</text><text class="s" x="699.0" y="108" text-anchor="middle">扫描或定位采样</text><path class="a" d="M824 94H840"/><rect x="848" y="50" width="250" height="88" rx="12" fill="#eef5fa" stroke="#bdced8"/><text class="t" x="973.0" y="81" text-anchor="middle">REPORT</text><text class="s" x="973.0" y="108" text-anchor="middle">只发一次终态</text><path class="a" d="M970 138V202H151V148"/><text class="s" x="390" y="195">完成后清理任务，回到 IDLE</text><text class="s" x="28" y="245">扫描请求从 IDLE 直接到 RUNNING；总停进入 PAUSED，默认清理会话。</text></svg>