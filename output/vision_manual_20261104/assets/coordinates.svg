<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 255" role="img"><title>相机 TCP 和基座坐标的变换方向</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#467b94"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#203d4e}.t{font-size:19px;font-weight:bold}.s{font-size:15px;fill:#476778}.a{fill:none;stroke:#467b94;stroke-width:2;marker-end:url(#arrow)}</style><rect width="1120" height="255" rx="15" fill="#f8fbfd"/><rect x="25" y="50" width="320" height="86" rx="12" fill="#eef5fa" stroke="#bdced8"/><text class="t" x="185.0" y="81" text-anchor="middle">相机 C 系</text><text class="s" x="185.0" y="108" text-anchor="middle">目标相对光心 · mm</text><rect x="400" y="50" width="320" height="86" rx="12" fill="#eef5fa" stroke="#bdced8"/><text class="t" x="560.0" y="81" text-anchor="middle">TCP E 系</text><text class="s" x="560.0" y="108" text-anchor="middle">目标相对夹爪中心 · mm</text><rect x="775" y="50" width="320" height="86" rx="12" fill="#eef5fa" stroke="#bdced8"/><text class="t" x="935.0" y="81" text-anchor="middle">基座 B 系</text><text class="s" x="935.0" y="108" text-anchor="middle">目标相对机械臂基座 · mm</text><path class="a" d="M345 94H390"/><path class="a" d="M720 94H765"/><text class="s" x="188" y="181" text-anchor="middle">角点 / 轮廓 + 内参 + 物理尺寸</text><text class="s" x="560" y="181" text-anchor="middle">K230：T_E_from_C</text><text class="s" x="934" y="181" text-anchor="middle">MCU：观察姿态 T_B_from_E</text><text class="s" x="28" y="226">同一物理参考点逐步换坐标系；改臂姿态后 E 坐标会变，正确换算后的 B 坐标应一致。</text></svg>